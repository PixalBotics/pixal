services:
  - type: web
    name: pixal-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: ALLOWED_ORIGINS
        value: https://pixalbotics.com,https://www.pixalbotics.com
      - key: MONGODB_URI
        sync: false
      # SendGrid (recommended for Render)
      - key: EMAIL_SERVICE
        value: sendgrid
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: Pixal Botics
      # Admin inbox for contact form notifications (optional; defaults to SENDGRID_FROM)
      - key: ADMIN_EMAIL
        sync: false
      # cPanel SMTP (optional; use when not using SendGrid)
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: JWT_SECRET
        sync: false
      # Cloudinary – images & PDFs (set in Render env; format: cloudinary://KEY:SECRET@CLOUD_NAME)
      - key: CLOUDINARY_URL
        sync: false
      - key: KEEP_ALIVE_URL
        fromService:
          type: web
          name: pixal-api
          property: url
        value: ${SERVICE_URL}/ping
      - key: KEEP_ALIVE_INTERVAL
        value: 300000

  - type: cron
    name: pixal-post-social
    env: node
    schedule: "0 6,11,16 * * *"
    buildCommand: npm install
    startCommand: node scripts/postSocial.js
    envVars:
      - key: API_BASE_URL
        sync: false
      - key: FB_PAGE_ID
        sync: false
      - key: FB_PAGE_ACCESS_TOKEN
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: POSTS_PER_RUN
        value: 1
      - key: SLOT_HOURS
        value: 8

  - type: cron
    name: pixal-post-daily-blogs
    env: node
    schedule: "0 5 * * *"
    buildCommand: npm install
    startCommand: node scripts/postDailyBlogs.js
    envVars:
      - key: API_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: POSTS_PER_RUN
        value: 2
